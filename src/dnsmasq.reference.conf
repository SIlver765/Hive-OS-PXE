# Reference copy of what server.py generates at runtime (/tmp/dnsmasq.conf). Edit server.py, not this file.
# 192.168.1.50 = the Umbrel's IP, eth0 = its interface (both auto-detected).
port=0
interface=eth0
bind-interfaces
log-dhcp
# proxyDHCP: the router keeps handing out addresses; we only add the PXE boot info (UDP 67 + 4011)
dhcp-range=192.168.1.50,proxy
# TFTP (UDP 69) serves the iPXE binaries and a stub boot.ipxe
enable-tftp
tftp-root=/srv/tftp
# iPXE identifies itself with DHCP option 175; give it the script, give raw PXE ROMs iPXE first
dhcp-match=set:ipxe,175
pxe-service=tag:!ipxe,x86PC,"Hive OS Deploy (BIOS)",undionly.kpxe
pxe-service=tag:!ipxe,BC_EFI,"Hive OS Deploy (UEFI)",ipxe.efi
pxe-service=tag:!ipxe,X86-64_EFI,"Hive OS Deploy (UEFI)",ipxe.efi
pxe-service=tag:ipxe,x86PC,"Hive OS Deploy",boot.ipxe
pxe-service=tag:ipxe,BC_EFI,"Hive OS Deploy",boot.ipxe
pxe-service=tag:ipxe,X86-64_EFI,"Hive OS Deploy",boot.ipxe
