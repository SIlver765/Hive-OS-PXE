version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: host.docker.internal   # the server uses host networking
      APP_PORT: 8381
      PROXY_AUTH_ADD: "false"          # the app has its own login with forced password change

  server:
    image: ghcr.io/silver765/hive-os-pxe:v1.0-Dev
    restart: on-failure
    network_mode: host                 # PXE needs L2 broadcast: UDP 67 (proxyDHCP), 69 (TFTP), 4011 (PXE)
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    environment:
      ADMIN_PORT: "8381"               # behind app_proxy (Umbrel publishes 8380)
      PUBLIC_PORT: "8382"              # rig-facing: iPXE script, netboot files, image
      INITIAL_PASSWORD: ${APP_PASSWORD}   # shown in the Umbrel UI; must be changed at first login
      # SERVER_IP: 192.168.1.50          # uncomment to override auto-detection
    volumes:
      - ${APP_DATA_DIR}/data:/data
